<!DOCTYPE html>
<html>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: auto; padding: 20px;">
    <h2 style="color: #111;">{{COMPANY_NAME}}</h2>
    <h1>Invitation to Register for Programme</h1>
    
    <p><strong>Date:</strong> {{DATE}}</p>
    <p><strong>Time:</strong> {{TIME}}</p>
    <p><strong>Format:</strong> {{TYPE}}</p>
    
    <div style="margin: 25px 0;">
        <a href="{{ACCEPT_LINK}}" style="background-color: #16a34a; color: white; padding: 12px 20px; text-decoration: none; border-radius: 6px; font-weight: bold; margin-right: 10px;">
            Accept Invite
        </a>
        <a href="{{DECLINE_LINK}}" style="background-color: #dc2626; color: white; padding: 12px 20px; text-decoration: none; border-radius: 6px; font-weight: bold;">
            Decline
        </a>
    </div>
    
    <p style="font-size: 13px; color: #666;">
        Clicking an option opens a quick reply email context block framework. Hit send!
    </p>
</body>
</html>
