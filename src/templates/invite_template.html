<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f9f9f9; color: #111111; margin: 0; padding: 24px; }
    .card { max-width: 480px; margin: 0 auto; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 32px; }
    .company { font-size: 14px; color: #6b7280; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px; }
    .title { font-size: 22px; font-weight: 800; line-height: 1.3; margin: 0 0 24px 0; color: #000000; }
    .info-row { font-size: 15px; color: #374151; margin-bottom: 8px; display: flex; }
    .info-label { font-weight: 600; width: 80px; color: #6b7280; }
    .btn-group { margin-top: 32px; }
    .btn { display: block; text-align: center; padding: 14px; border-radius: 10px; font-weight: 600; text-decoration: none; font-size: 15px; margin-bottom: 12px; }
    .btn-accept { background-color: #10b981; color: #ffffff !important; }
    .btn-decline { background-color: #ef4444; color: #ffffff !important; }
    .footer { text-align: center; font-size: 12px; color: #9ca3af; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="company">{{COMPANY_NAME}}</div>
    <h1 class="title">Invitation to Join our Programme</h1>
    
    <div class="info-row"><span class="info-label">Date:</span> <span>{{DATE}}</span></div>
    <div class="info-row"><span class="info-label">Time:</span> <span>{{TIME}}</span></div>
    <div class="info-row"><span class="info-label">Format:</span> <span>{{TYPE}}</span></div>

    <div class="btn-group">
      <!-- mailto links force the native client to reply directly back to your server endpoint -->
      <a href="mailto:{{REPLY_EMAIL}}?subject=RSVP: ACCEPT" class="btn btn-accept">Accept & Register</a>
      <a href="mailto:{{REPLY_EMAIL}}?subject=RSVP: DECLINE" class="btn btn-decline">Decline Invite</a>
    </div>
  </div>
  <div class="footer">
    Automated via Enterprise Communications Engine.
  </div>
</body>
</html>
