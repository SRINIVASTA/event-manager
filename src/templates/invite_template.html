<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f5f7; color: #111111; margin: 0; padding: 24px; }
    .card { max-width: 460px; margin: 0 auto; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 32px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .company { font-size: 13px; color: #4b5563; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
    .title { font-size: 20px; font-weight: 800; line-height: 1.4; margin: 0 0 20px 0; color: #000000; }
    .info-box { background: #f9fafb; border-radius: 8px; padding: 16px; margin-bottom: 24px; border: 1px solid #f3f4f6; }
    .info-row { font-size: 14px; margin-bottom: 6px; color: #374151; }
    .info-row:last-child { margin-bottom: 0; }
    .info-label { font-weight: 600; color: #6b7280; display: inline-block; width: 65px; }
    .btn-group { margin-top: 24px; }
    .btn { display: block; text-align: center; padding: 12px; border-radius: 8px; font-weight: 600; text-decoration: none; font-size: 14px; margin-bottom: 10px; }
    .btn-accept { background-color: #000000; color: #ffffff !important; }
    .btn-decline { border: 1px solid #e5e7eb; color: #4b5563 !important; background: #ffffff; }
    .footer { text-align: center; font-size: 11px; color: #9ca3af; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="company">{{COMPANY_NAME}}</div>
    <h1 class="title">Invitation to Register for Programme</h1>
    
    <div class="info-box">
      <div class="info-row"><span class="info-label">Date:</span> <span>{{DATE}}</span></div>
      <div class="info-row"><span class="info-label">Time:</span> <span>{{TIME}}</span></div>
      <div class="info-row"><span class="info-label">Format:</span> <span>{{TYPE}}</span></div>
    </div>

    <div class="btn-group">
      <a href="{{ACCEPT_LINK}}" class="btn btn-accept">Accept Invite</a>
      <a href="{{DECLINE_LINK}}" class="btn btn-decline">Decline</a>
    </div>
    <p class="footer">Clicking an option opens a quick reply email context block framework. Hit send!</p>
  </div>
</body>
</html>
